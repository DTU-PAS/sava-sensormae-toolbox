 # Author: PAS Group DTU

# Modality & task configuration
modalities:
  primary: rgb
  secondary: depth
task: detection

# Runtime configuration
model_path: /home/bdasz/Desktop/SAVA/code/sava-sensormae-toolbox/data/model_final.onnx
runtime: onnxruntime
providers:
  - CUDAExecutionProvider
  - CPUExecutionProvider
batch_size: 1 # For now, 1 is the only accepted value

# Model configuration
input_size: [576, 576] # [height, width]
confidence_threshold: 0.8
classes:
  - car
  - large_vehicle
  - two_wheeler
  - pedestrian
 