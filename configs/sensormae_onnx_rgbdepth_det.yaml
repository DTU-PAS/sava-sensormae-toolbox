 # Author: PAS Group DTU

# Modality & task configuration
modalities:
  primary: rgb
  secondary: depth
task: detection

# Runtime configuration
model_path: data/20260831_141121_rgb-depth_vit-tiny_RFDETRHead_2D_KITTI_VoD.onnx
runtime: onnxruntime
providers:
  - CUDAExecutionProvider
  - CPUExecutionProvider
batch_size: 1 # For now, 1 is the only accepted value

# Model configuration
input_size: [576, 576]
confidence_threshold: 0.7
classes:
  - Car
  - Two Wheeler
  - Pedestrian
 